services:
  postgres:
    image: postgres:17-alpine
    container_name: polymarketlab-postgres
    environment:
      POSTGRES_DB: polymarket_lab
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - polymarketlab-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d polymarket_lab"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

volumes:
  polymarketlab-postgres-data:
